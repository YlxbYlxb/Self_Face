server:
  # 默认 8081：本机 8080 已被其他项目（SmartService）占用。
  # 用 start-dev.sh 启动时，脚本会显式覆盖 SERVER_PORT（改用 SELFFACE_PORT 换端口）——
  # 因为某些终端会向子进程注入 SERVER_PORT，详见脚本内注释。
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: selfface
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库不存在会自动创建，无需手动执行 CREATE DATABASE
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfface}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    async:
      request-timeout: 300000
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 调试 SQL 时改成 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  cors:
    # 开发期放开本机任意端口的 dev server；生产环境由 Nginx 同源代理，置空即可
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    # 生产环境请换成随机长字符串，或用环境变量 JWT_SECRET 覆盖
    # prod profile 下若仍是这个内置值，应用会拒绝启动
    secret: ${JWT_SECRET:selfface-dev-secret-please-change-it-2026}
    expire-hours: 168
  crypto:
    # 用于加密用户存在库里的 LLM API Key（AES-256-GCM）。
    # 换了这个值，已存的 Key 会解不开，需要让用户在设置页重新填写。
    # 生成示例：openssl rand -base64 32
    key: ${APP_CRYPTO_KEY:selfface-dev-crypto-key-please-change-2026}
  seed:
    # 启动时把 resources/seed 下的题库按标题去重增量导入
    enabled: true
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # 每个 IP 每分钟允许的普通请求数
    general-per-minute: 240
    # 登录/注册：防暴力破解
    auth-per-minute: 10
    # 大模型相关：触发真实计费，单独收紧
    llm-per-minute: 20
    # 单用户进行中的简历分析任务上限
    max-running-resume-jobs: 1

logging:
  level:
    root: info
    com.selfface: info
