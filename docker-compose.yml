name: selfface

# 用法：
#   1) cp .env.example .env 并填写三个密钥
#   2) docker compose up -d --build
#   3) 浏览器打开 http://localhost:8090
#
# 三个密钥没有默认值，缺失时 compose 会直接报错退出，
# 避免用空密钥或内置开发密钥把服务跑起来。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-selfface}
      TZ: Asia/Shanghai
    command:
      # 中文题干和答案依赖 utf8mb4，默认字符集在旧版本镜像上不一定是它
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 默认不向宿主机暴露端口：后端走 compose 内网连它。
    # 暴露到公网等于把数据库端口直接放到互联网上，会被扫描器持续爆破。
    # 需要在宿主机上用客户端连进来排查时，临时取消下面两行注释。
    # ports:
    #   - "${MYSQL_EXPOSED_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app]

  backend:
    build:
      context: ./backend
      args:
        # 国内服务器构建时在 .env 里改成 https://maven.aliyun.com/repository/public
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-selfface}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 这两个是 prod profile 强制要求的外部密钥，不设会启动失败
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:?请在 .env 中设置 APP_CRYPTO_KEY}
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    # 后端不直接对宿主机暴露端口，所有流量从 Nginx 进来。
    # 需要用 curl 直接调接口排查时，把下面两行取消注释。
    # ports:
    #   - "8081:8081"
    networks: [app]

  frontend:
    build:
      context: ./frontend
      args:
        # 国内服务器构建时在 .env 里改成 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # 备案号在构建期内联，填了就展示在页面底部；留空则不渲染
        VITE_ICP_BEIAN: ${ICP_BEIAN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 8090 而不是 8080 —— 本机 8080 已被其他项目占用
      - "${WEB_PORT:-8090}:80"
    networks: [app]

  # HTTPS 终结层。默认不启动 —— 备案通过、域名解析到本机之后再起：
  #   docker compose --profile tls up -d
  # 起来之前必须在 .env 里设置 APP_DOMAIN，Caddy 会自动申请并续期免费证书。
  # 备案期间不需要它，用 http://IP:8090 访问即可。
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      # 默认值写成 localhost 而不是留空：留空 Caddy 会因为缺少站点地址直接启动失败，
      # 那种报错很难看懂。用 localhost 至少容器能起来，日志里能看到证书签发给谁。
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    networks: [app]

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  app:
