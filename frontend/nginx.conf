server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端构建产物里最大的是 Element Plus 与 markdown 解析，
    # 开 gzip 后体积能压掉约七成，首屏收益明显
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 带内容哈希的构建产物可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 接口转发到后端容器。proxy_pass 不带路径，
    # 因此 /api/xxx 会原样透传，与后端 @RequestMapping("/api/...") 对齐
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;

        # 限流按真实客户端 IP 计数，这几个头必须透传，
        # 否则所有请求在容器里都来自网关地址，会被算成同一个来源
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 简历分析虽已改为异步，但连通性自检等接口仍可能跑满一个超时周期
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 上传简历走 multipart，别让 nginx 把请求体缓冲到磁盘
        proxy_request_buffering off;
        client_max_body_size 12m;
    }

    # 入口 HTML 不缓存，否则用户会拿着旧的 index.html 去请求已被删除的旧资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 的 history 路由：/questions、/resume 这类路径在磁盘上没有对应文件，
    # 回落到 index.html 交给前端路由处理，否则直接刷新会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
